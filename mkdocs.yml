site_name: Harpia Arch
site_description: Arquitetura Java para workflows tipados sobre Quarkus.
site_url: https://krisner94.github.io/Harpia-Arch/
site_author: Rhama Krisner
repo_url: https://github.com/Krisner94/Harpia-Arch
repo_name: Krisner94/Harpia-Arch
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Rhama Krisner

theme:
  name: gitbook
  custom_dir: overrides

hooks:
  - hooks.py

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: pt
          name: Português
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: Java architecture for typed workflows on Quarkus.
          nav_translations:
            Início: Home
            Primeiros passos: Getting started
            Módulos: Modules
            Núcleo: Core
            Workflow engine: Workflow engine
            Annotations: Annotations
            Validação em build: Build validation
            Guias: Guides
            Contract First: Contract First
            Persistência: Persistence
            Segurança: Security
            Native Image: Native Image
            Benchmarks: Benchmarks
            Maven Central: Maven Central
            Arquitetura: Architecture
            Decisões: Decisions
            Referência: Reference
            API Java: Java API
            FAQ: FAQ
            Contribuição: Contributing
            Changelog: Changelog

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Primeiros passos: getting-started.md
  - Módulos: modules.md
  - Núcleo:
      - Workflow engine: core/workflow-engine.md
      - Annotations: core/annotations.md
      - Validação em build: core/build-validation.md
  - Guias:
      - Contract First: guides/contract-first.md
      - Persistência: guides/persistence.md
      - Segurança: guides/security.md
      - Native Image: guides/native-image.md
      - Benchmarks: guides/benchmarks.md
      - Maven Central: guides/maven-central.md
  - Arquitetura:
      - Decisões: architecture/decisions.md
  - Referência:
      - API Java: reference/api.md
      - FAQ: faq.md
  - Contribuição: contributing.md
  - Changelog: changelog.md
