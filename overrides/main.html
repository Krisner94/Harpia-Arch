{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<script>
  (function () {
    try {
      var stored = localStorage.getItem("harpia-accent");
      if (stored && /^#[0-9a-f]{6}$/i.test(stored)) {
        document.documentElement.style.setProperty("--harpia-accent", stored);
      }
    } catch (error) {
    }
  })();
</script>
{% endblock %}

{% block styles %}
{{ super() }}
<style>
  :root { --harpia-accent: {{ config.extra.theme_color | default('#008cff') }}; }
  .markdown-section a,
  .search-results-item a {
    color: var(--harpia-accent);
  }
  .book-summary ul.summary li.active > a,
  .book-summary ul.summary li a.active,
  .language-switcher a.active {
    color: var(--harpia-accent) !important;
  }
  .header-brand:hover,
  .header-link:hover {
    color: var(--harpia-accent);
  }
  .search-results { display: none; }
  body.with-search .search-noresults { display: none; }
  body.with-search .search-results { display: block; }
  body.with-search .search-results .has-results { display: block; }
  body.with-search .search-results .no-results { display: none; }
  body.with-search.no-search-results .search-results .has-results { display: none; }
  body.with-search.no-search-results .search-results .no-results { display: block; }
  .search-results-list { list-style: none; padding-left: 0; }
  .search-results-item { margin-bottom: 1.6em; }
  .search-results-item a { font-weight: 600; }
  .search-results-item p { margin: .3em 0 0; }
  .book-summary ul.summary li.nav-section > span {
    display: block;
    padding: 14px 15px 6px;
    font-weight: 600;
    color: #364149;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .book-summary ul.summary li.nav-section > ul {
    padding-left: 12px;
    margin: 0;
  }
  .book-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 15px;
    background: #ffffff;
    border-bottom: 1px solid rgba(0, 0, 0, .07);
  }
  .header-menu {
    display: none;
    background: none;
    border: 0;
    padding: 0 6px 0 0;
    color: #364149;
    font-size: 22px;
    line-height: 50px;
    cursor: pointer;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #364149;
    font-size: 1.8rem;
    font-weight: 600;
  }
  .header-brand:hover {
    text-decoration: none;
  }
  .header-logo {
    width: 30px;
    height: 30px;
    border-radius: 7px;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-left: auto;
    font-size: 1.2rem;
    color: #7e888b;
  }
  .header-version {
    padding: 2px 7px;
    border: 1px solid rgba(0, 0, 0, .12);
    border-radius: 10px;
    color: #939da3;
    white-space: nowrap;
  }
  .header-link {
    color: #364149;
    font-weight: 500;
  }
  .language-switcher {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 12px;
    border-left: 1px solid rgba(0, 0, 0, .1);
  }
  .language-switcher a {
    color: #7e888b;
    padding: 2px;
  }
  .language-switcher a.active {
    color: #008cff;
    font-weight: 700;
  }
  .theme-color {
    display: flex;
    align-items: center;
  }
  .theme-color input[type="color"] {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 1px solid rgba(0, 0, 0, .15);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  .theme-color input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
  }
  .theme-color input[type="color"]::-webkit-color-swatch,
  .theme-color input[type="color"]::-moz-color-swatch {
    border: none;
    border-radius: 50%;
  }
  @media (max-width: 600px) {
    .header-menu {
      display: block;
    }
    .header-title,
    .header-version {
      display: none;
    }
    .header-actions {
      gap: 8px;
    }
  }
</style>
{% endblock %}

{% block libs %}
{{ super() }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: true });</script>
<script>
  (function () {
    var input = document.querySelector("#book-search-input input");
    if (!input) {
      return;
    }

    var isEnglish = document.documentElement.lang === "en";
    var baseUrl = "{{ base_url }}";
    if (baseUrl && baseUrl.slice(-1) !== "/") {
      baseUrl += "/";
    }
    var docs = null;

    function normalize(value) {
      return (value || "").toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function load() {
      if (docs) {
        return Promise.resolve(docs);
      }
      return fetch(baseUrl + "search/search_index.json")
        .then(function (response) { return response.json(); })
        .then(function (data) {
          docs = data.docs.filter(function (doc) {
            var isLocalized = doc.location.indexOf("en/") === 0;
            return isEnglish ? isLocalized : !isLocalized;
          });
          return docs;
        });
    }

    function clear() {
      document.body.classList.remove("with-search", "no-search-results");
    }

    function search() {
      var query = input.value.trim();
      if (query.length < 2) {
        clear();
        return;
      }

      load().then(function (entries) {
        var normalized = normalize(query);
        var results = entries.filter(function (doc) {
          return normalize(doc.title).indexOf(normalized) !== -1
            || normalize(doc.text).indexOf(normalized) !== -1;
        }).slice(0, 20);

        var list = document.querySelector(".search-results-list");
        list.innerHTML = "";

        results.forEach(function (doc) {
          var item = document.createElement("li");
          item.className = "search-results-item";

          var link = document.createElement("a");
          link.href = baseUrl + doc.location;
          link.textContent = doc.title || doc.location;

          var excerpt = document.createElement("p");
          var text = (doc.text || "").replace(/\s+/g, " ").trim();
          var position = normalize(text).indexOf(normalized);
          var start = Math.max(0, position - 60);
          var end = Math.min(text.length, position + 120);
          excerpt.textContent = text.substring(start, end) + (end < text.length ? "…" : "");

          item.appendChild(link);
          item.appendChild(excerpt);
          list.appendChild(item);
        });

        document.querySelector(".search-results-count").textContent = results.length;
        document.querySelectorAll(".search-query").forEach(function (element) {
          element.textContent = query;
        });
        document.body.classList.add("with-search");
        document.body.classList.toggle("no-search-results", results.length === 0);
      });
    }

    input.addEventListener("input", search);
    input.addEventListener("keyup", search);
    input.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        input.value = "";
        clear();
      }
    });
  })();
</script>

<script>
  (function () {
    var book = document.querySelector(".book");
    var button = document.querySelector(".header-menu");
    if (book && button) {
      button.addEventListener("click", function () {
        book.classList.toggle("with-summary");
      });
      document.querySelectorAll(".book-summary a").forEach(function (link) {
        link.addEventListener("click", function () {
          if (window.innerWidth <= 600) {
            book.classList.remove("with-summary");
          }
        });
      });
    }
  })();
</script>


<script>
  (function () {
    var input = document.querySelector("#theme-color");
    if (!input) {
      return;
    }

    try {
      var stored = localStorage.getItem("harpia-accent");
      if (stored && /^#[0-9a-f]{6}$/i.test(stored)) {
        input.value = stored;
      }
    } catch (error) {
    }

    input.addEventListener("input", function () {
      document.documentElement.style.setProperty("--harpia-accent", input.value);
      try {
        localStorage.setItem("harpia-accent", input.value);
      } catch (error) {
      }
    });
  })();
</script>

{% endblock %}
