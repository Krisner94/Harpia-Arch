{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<script>
  (function () {
    var theme = "light";
    try {
      var stored = localStorage.getItem("harpia-theme");
      if (stored === "light" || stored === "dark") {
        theme = stored;
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        theme = "dark";
      }
    } catch (error) {
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
{% endblock %}

{% block styles %}
{{ super() }}
<style>
  :root {
    --harpia-accent: #008cff;
    --harpia-bg: #ffffff;
    --harpia-text: #333333;
    --harpia-muted: #7e888b;
    --harpia-sidebar: #fafafa;
    --harpia-header: #ffffff;
    --harpia-border: rgba(0, 0, 0, .07);
    --harpia-code: #f7f7f7;
    --harpia-table: #f8f8f8;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --harpia-accent: #4da3ff;
    --harpia-bg: #16181d;
    --harpia-text: #d7dbe0;
    --harpia-muted: #9aa3ad;
    --harpia-sidebar: #111318;
    --harpia-header: #111318;
    --harpia-border: rgba(255, 255, 255, .09);
    --harpia-code: #22262d;
    --harpia-table: #1b1f26;
  }
  html, body {
    background: var(--harpia-bg);
    color: var(--harpia-text);
  }
  .book-body, .page-wrapper {
    background: var(--harpia-bg);
  }
  .book-summary {
    background: var(--harpia-sidebar);
    color: var(--harpia-text);
    border-right-color: var(--harpia-border);
  }
  .book-summary ul.summary li a,
  .book-summary ul.summary li span {
    color: var(--harpia-text);
  }
  .book-summary ul.summary li.header {
    color: var(--harpia-muted);
  }
  .book-summary ul.summary li.divider {
    background: var(--harpia-border);
  }
  .book-header {
    background: var(--harpia-header);
    border-bottom-color: var(--harpia-border);
  }
  .header-brand, .header-link {
    color: var(--harpia-text);
  }
  .header-version {
    color: var(--harpia-muted);
    border-color: var(--harpia-border);
  }
  .language-switcher a {
    color: var(--harpia-muted);
  }
  .markdown-section {
    color: var(--harpia-text);
  }
  .markdown-section h1, .markdown-section h2, .markdown-section h3,
  .markdown-section h4, .markdown-section h5, .markdown-section h6 {
    color: var(--harpia-text);
  }
  .markdown-section a,
  .search-results-item a {
    color: var(--harpia-accent);
  }
  .markdown-section code {
    background: var(--harpia-code);
    color: var(--harpia-text);
  }
  .markdown-section pre,
  .markdown-section pre > code {
    background: var(--harpia-code);
    color: var(--harpia-text);
  }
  .markdown-section table {
    background: var(--harpia-bg);
  }
  .markdown-section table tr {
    background: var(--harpia-bg);
    border-color: var(--harpia-border);
  }
  .markdown-section table tr:nth-child(2n) {
    background: var(--harpia-table);
  }
  .markdown-section table th,
  .markdown-section table td {
    border-color: var(--harpia-border);
  }
  .markdown-section table th {
    background: var(--harpia-table);
    color: var(--harpia-text);
  }
  .markdown-section blockquote {
    color: var(--harpia-muted);
    border-left-color: var(--harpia-border);
  }
  .markdown-section hr {
    background-color: var(--harpia-border);
  }
  #book-search-input input {
    color: var(--harpia-text);
  }
  .search-results-title,
  .search-results-item p {
    color: var(--harpia-muted);
  }
  .search-results-item {
    color: var(--harpia-text);
  }
  .book-summary ul.summary li.active > a,
  .book-summary ul.summary li a.active,
  .language-switcher a.active {
    color: var(--harpia-accent) !important;
  }
  .header-brand:hover,
  .header-link:hover {
    color: var(--harpia-accent);
  }
  .search-results { display: none; }
  body.with-search .search-noresults { display: none; }
  body.with-search .search-results { display: block; }
  body.with-search .search-results .has-results { display: block; }
  body.with-search .search-results .no-results { display: none; }
  body.with-search.no-search-results .search-results .has-results { display: none; }
  body.with-search.no-search-results .search-results .no-results { display: block; }
  .search-results-list { list-style: none; padding-left: 0; }
  .search-results-item { margin-bottom: 1.6em; }
  .search-results-item a { font-weight: 600; }
  .search-results-item p { margin: .3em 0 0; }
  .book-summary ul.summary li.nav-section > span {
    display: block;
    padding: 14px 15px 6px;
    font-weight: 600;
    color: var(--harpia-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .book-summary ul.summary li.nav-section > ul {
    padding-left: 12px;
    margin: 0;
  }
  .book-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 15px;
    background: var(--harpia-header);
    border-bottom: 1px solid var(--harpia-border);
  }
  .header-menu {
    display: none;
    background: none;
    border: 0;
    padding: 0 6px 0 0;
    color: var(--harpia-text);
    font-size: 22px;
    line-height: 50px;
    cursor: pointer;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--harpia-text);
    font-size: 1.8rem;
    font-weight: 600;
  }
  .header-brand:hover {
    text-decoration: none;
  }
  .header-logo {
    width: 30px;
    height: 30px;
    border-radius: 7px;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-left: auto;
    font-size: 1.2rem;
    color: var(--harpia-muted);
  }
  .header-version {
    padding: 2px 7px;
    border: 1px solid var(--harpia-border);
    border-radius: 10px;
    color: var(--harpia-muted);
    white-space: nowrap;
  }
  .header-link {
    color: var(--harpia-text);
    font-weight: 500;
  }
  .language-switcher {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 12px;
    border-left: 1px solid var(--harpia-border);
  }
  .language-switcher a {
    color: var(--harpia-muted);
    padding: 2px;
  }
  .language-switcher a.active {
    color: var(--harpia-accent);
    font-weight: 700;
  }
  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    border: 0;
    background: none;
    color: var(--harpia-muted);
    cursor: pointer;
  }
  .theme-toggle:hover {
    color: var(--harpia-accent);
  }
  .theme-toggle .icon-sun {
    display: none;
  }
  html[data-theme="dark"] .theme-toggle .icon-sun {
    display: block;
  }
  html[data-theme="dark"] .theme-toggle .icon-moon {
    display: none;
  }
  html[data-theme="dark"] .book-header {
    background-color: #111318 !important;
  }
  html[data-theme="dark"] #book-search-input {
    background-color: #111318;
  }
  html[data-theme="dark"] #book-search-input input {
    background: transparent;
  }
  @media (max-width: 600px) {
    .header-menu {
      display: block;
    }
    .header-title,
    .header-version {
      display: none;
    }
    .header-actions {
      gap: 8px;
    }
  }
</style>
{% endblock %}

{% block libs %}
{{ super() }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: true });</script>
<script>
  (function () {
    var input = document.querySelector("#book-search-input input");
    if (!input) {
      return;
    }

    var isEnglish = document.documentElement.lang === "en";
    var baseUrl = "{{ base_url }}";
    if (baseUrl && baseUrl.slice(-1) !== "/") {
      baseUrl += "/";
    }
    var docs = null;

    function normalize(value) {
      return (value || "").toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function load() {
      if (docs) {
        return Promise.resolve(docs);
      }
      return fetch(baseUrl + "search/search_index.json")
        .then(function (response) { return response.json(); })
        .then(function (data) {
          docs = data.docs.filter(function (doc) {
            var isLocalized = doc.location.indexOf("en/") === 0;
            return isEnglish ? isLocalized : !isLocalized;
          });
          return docs;
        });
    }

    function clear() {
      document.body.classList.remove("with-search", "no-search-results");
    }

    function search() {
      var query = input.value.trim();
      if (query.length < 2) {
        clear();
        return;
      }

      load().then(function (entries) {
        var normalized = normalize(query);
        var results = entries.filter(function (doc) {
          return normalize(doc.title).indexOf(normalized) !== -1
            || normalize(doc.text).indexOf(normalized) !== -1;
        }).slice(0, 20);

        var list = document.querySelector(".search-results-list");
        list.innerHTML = "";

        results.forEach(function (doc) {
          var item = document.createElement("li");
          item.className = "search-results-item";

          var link = document.createElement("a");
          link.href = baseUrl + doc.location;
          link.textContent = doc.title || doc.location;

          var excerpt = document.createElement("p");
          var text = (doc.text || "").replace(/\s+/g, " ").trim();
          var position = normalize(text).indexOf(normalized);
          var start = Math.max(0, position - 60);
          var end = Math.min(text.length, position + 120);
          excerpt.textContent = text.substring(start, end) + (end < text.length ? "…" : "");

          item.appendChild(link);
          item.appendChild(excerpt);
          list.appendChild(item);
        });

        document.querySelector(".search-results-count").textContent = results.length;
        document.querySelectorAll(".search-query").forEach(function (element) {
          element.textContent = query;
        });
        document.body.classList.add("with-search");
        document.body.classList.toggle("no-search-results", results.length === 0);
      });
    }

    input.addEventListener("input", search);
    input.addEventListener("keyup", search);
    input.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        input.value = "";
        clear();
      }
    });
  })();
</script>

<script>
  (function () {
    var book = document.querySelector(".book");
    var button = document.querySelector(".header-menu");
    if (book && button) {
      button.addEventListener("click", function () {
        book.classList.toggle("with-summary");
      });
      document.querySelectorAll(".book-summary a").forEach(function (link) {
        link.addEventListener("click", function () {
          if (window.innerWidth <= 600) {
            book.classList.remove("with-summary");
          }
        });
      });
    }
  })();
</script>


<script>
  (function () {
    var root = document.documentElement;
    var button = document.querySelector("#theme-toggle");
    if (!button) {
      return;
    }

    button.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      button.setAttribute("aria-label", next === "dark" ? "Ativar tema claro" : "Ativar tema escuro");
      try {
        localStorage.setItem("harpia-theme", next);
      } catch (error) {
      }
    });
  })();
</script>

{% endblock %}
