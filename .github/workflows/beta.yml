name: Beta (snapshot)

# Ambiente de testes: publica o snapshot mais recente da main no repositório
# de snapshots do Maven Central. Nada é publicado de forma definitiva.
#
# Consumo:
#   <repository>
#     <id>central-snapshots</id>
#     <url>https://central.sonatype.com/repository/maven-snapshots/</url>
#   </repository>

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "**.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  precheck:
    name: Check credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - id: secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        run: |
          if [ -n "$CENTRAL_USERNAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets do Central Portal ausentes. Rode scripts/setup-release-env.sh para ativar o canal beta."
          fi

  publish-beta:
    name: Publish beta snapshot
    needs: precheck
    if: needs.precheck.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configure Maven settings
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p "$HOME/.m2"
          {
            printf '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">\n'
            printf '  <servers>\n    <server>\n      <id>central</id>\n'
            printf '      <username>%s</username>\n' "$CENTRAL_USERNAME"
            printf '      <password>%s</password>\n' "$CENTRAL_PASSWORD"
            printf '    </server>\n  </servers>\n</settings>\n'
          } > "$HOME/.m2/settings.xml"

      - name: Diagnostic credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          echo "user_len=${#CENTRAL_USERNAME} pass_len=${#CENTRAL_PASSWORD}"
          printf '%s' "$CENTRAL_USERNAME" | sha256sum | cut -c1-16
          printf '%s' "$CENTRAL_PASSWORD" | sha256sum | cut -c1-16
          sha256sum "$HOME/.m2/settings.xml" | cut -c1-16

      - name: Resolve beta version
        id: version
        run: |
          BASE=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          BASE=${BASE%-SNAPSHOT}
          BASE=${BASE%-beta}
          BETA="${BASE}-beta-SNAPSHOT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          echo "Beta version: $BETA"

      - name: Set beta version
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="${{ steps.version.outputs.beta }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Deploy to Central snapshots
        run: |
          mvn -B -ntp -Prelease deploy \
            -Dgpg.skip=true \
            -Dmaven.javadoc.skip=true \
            -DskipITs

      - name: Summary
        run: |
          {
            echo "### Beta publicado"
            echo ""
            echo '```xml'
            echo "<dependency>"
            echo "  <groupId>io.github.krisner94</groupId>"
            echo "  <artifactId>harpia-quarkus</artifactId>"
            echo "  <version>${{ steps.version.outputs.beta }}</version>"
            echo "</dependency>"
            echo '```'
            echo ""
            echo "Repositório: https://central.sonatype.com/repository/maven-snapshots/"
          } >> "$GITHUB_STEP_SUMMARY"
