name: Release

# Produção. Dispara em push para a main e publica a versão do pom.xml no
# Maven Central — mas só se essa versão ainda não existir lá (o Central é
# imutável, então repetir a mesma versão falharia).
#
# Fluxo:
#   branch beta  -> X.Y.Z-beta-SNAPSHOT  (repositório de snapshots)
#   branch main  -> X.Y.Z                (Maven Central + tag + release)
#
# Para lançar 1.1.0: suba a versão para 1.1.0 na beta, valide, faça merge na
# main. O push na main é o gatilho. Se a versão já estiver publicada o
# workflow encerra como "nada a fazer" (verde), sem quebrar o build.

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "**.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (vazio = versão do pom.xml)"
        required: false
        type: string
      dry_run:
        description: "Apenas build e testes, sem publicar"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases só podem ser publicadas a partir da branch main (atual: $REF)."
            exit 1
          fi

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = "{http://maven.apache.org/POM/4.0.0}"
          print(ET.parse("pom.xml").getroot().find(ns + "version").text.strip())
          PY
          )
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION'. Use X.Y.Z ou X.Y.Z-qualifier."
            exit 1
          fi
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Versões -SNAPSHOT pertencem à branch beta."
            exit 1
          fi

          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          CENTRAL_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://repo1.maven.org/maven2/io/github/krisner94/harpia-core/$VERSION/harpia-core-$VERSION.pom")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION | tag v$VERSION existe: $TAG_EXISTS | Central: HTTP $CENTRAL_CODE"

          if [ "$TAG_EXISTS" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nada a fazer: a tag v$VERSION já existe."
          elif [ "$CENTRAL_CODE" = "200" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nada a fazer: a versão $VERSION já está publicada no Maven Central."
          elif [ "$DRY_RUN" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry_run ativo: apenas build e testes."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Build and test ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./mvnw -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Verify release profile
        run: ./mvnw -B -ntp -Prelease verify -Dgpg.skip=true -DskipITs

  publish:
    name: Publish ${{ needs.prepare.outputs.version }} to Maven Central
    needs: [prepare, verify]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production
      url: https://central.sonatype.com/publishing/deployments
    permissions:
      contents: write
    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configure Maven settings
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p "$HOME/.m2"
          {
            printf '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">\n'
            printf '  <servers>\n    <server>\n      <id>central</id>\n'
            printf '      <username>%s</username>\n' "$CENTRAL_USERNAME"
            printf '      <password>%s</password>\n' "$CENTRAL_PASSWORD"
            printf '    </server>\n  </servers>\n</settings>\n'
          } > "$HOME/.m2/settings.xml"

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons | grep -q '^sec' \
            || { echo "::error::Nenhuma chave secreta importada."; exit 1; }

      - name: Set release version
        run: |
          ./mvnw -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Deploy and publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          KEY_ARG=""
          if [ -n "$GPG_KEY_ID" ]; then
            KEY_ARG="-Dgpg.keyname=$GPG_KEY_ID"
          fi
          ./mvnw -B -ntp -Prelease deploy -DskipITs $KEY_ARG

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::notice::Tag v$VERSION já existe, pulando criação."
          else
            git tag -a "v$VERSION" -m "Harpia Arch $VERSION"
            git push origin "v$VERSION"
            gh release create "v$VERSION" \
              --title "Harpia Arch $VERSION" \
              --generate-notes \
              --verify-tag
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release $VERSION"
            echo ""
            echo "- Maven Central: https://repo1.maven.org/maven2/io/github/krisner94/harpia-core/$VERSION/"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
