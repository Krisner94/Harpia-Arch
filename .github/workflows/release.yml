name: Release

# Ambiente de produção: publica uma versão definitiva no Maven Central,
# cria a tag e o GitHub Release.
#
# O job `publish` usa o environment `production`, que exige aprovação manual
# (Settings > Environments > production > Required reviewers). O build e os
# testes rodam antes da aprovação; nada é publicado até você aprovar.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: 1.0.0)"
        required: true
        type: string
      next_version:
        description: "Versão de desenvolvimento após a release (padrão: patch+1-SNAPSHOT)"
        required: false
        type: string
      dry_run:
        description: "Apenas build e testes, sem publicar"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and test ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases só podem ser disparadas a partir da branch main (atual: $GITHUB_REF)."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION'. Use o formato X.Y.Z ou X.Y.Z-qualifier."
            exit 1
          fi
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::Versões -SNAPSHOT são publicadas pelo workflow Beta."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::A tag v$VERSION já existe. Escolha outra versão."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Verify release profile
        run: mvn -B -ntp -Prelease verify -Dgpg.skip=true -DskipITs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            harpia-core/target/*.jar
            harpia-core-deployment/target/*.jar
            harpia-quarkus/target/*.pom
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ inputs.version }} to Maven Central
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production
      url: https://central.sonatype.com/publishing/deployments
    permissions:
      contents: write
    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configure Maven settings
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p "$HOME/.m2"
          {
            printf '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">\n'
            printf '  <servers>\n    <server>\n      <id>central</id>\n'
            printf '      <username>%s</username>\n' "$CENTRAL_USERNAME"
            printf '      <password>%s</password>\n' "$CENTRAL_PASSWORD"
            printf '    </server>\n  </servers>\n</settings>\n'
          } > "$HOME/.m2/settings.xml"

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons | grep -q '^sec' \
            || { echo "::error::Nenhuma chave secreta importada."; exit 1; }

      - name: Set release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Deploy and publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          KEY_ARG=""
          if [ -n "$GPG_KEY_ID" ]; then
            KEY_ARG="-Dgpg.keyname=$GPG_KEY_ID"
          fi
          mvn -B -ntp -Prelease deploy -DskipITs $KEY_ARG

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Harpia Arch $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "Harpia Arch $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Bump development version
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          if [ -z "$NEXT_VERSION" ]; then
            MAJOR=${VERSION%%.*}
            REST=${VERSION#*.}
            MINOR=${REST%%.*}
            PATCH=${REST#*.}
            PATCH=${PATCH%%-*}
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          fi
          echo "Próxima versão de desenvolvimento: $NEXT_VERSION"
          mvn -B -ntp versions:set \
            -DnewVersion="$NEXT_VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true
          git add -A -- 'pom.xml' ':(glob)**/pom.xml'
          git commit -m "chore: start $NEXT_VERSION after $VERSION"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${{ inputs.version }}"
            echo ""
            echo "- Maven Central: https://repo1.maven.org/maven2/io/github/krisner94/harpia-core/${{ inputs.version }}/"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}"
            echo "- Central Portal: https://central.sonatype.com/publishing/deployments"
          } >> "$GITHUB_STEP_SUMMARY"
